name: Supabase Database Keep Alive

# 設定觸發定時器
on:
  schedule:
    # 這裡使用 Cron 語法，設定為「每 3 天的凌晨 0:00 (UTC 時間)」自動執行一次
    - cron: '0 0 */3 * *'
  # 允許你隨時手動在 GitHub 網頁上點擊按鈕測試執行
  workflow_dispatch:

jobs:
  ping_job:
    runs-on: ubuntu-latest

    steps:
    # 1. 複製 GitHub 倉庫程式碼到虛擬主機上
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 2. 安裝 Python 環境
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # 3. 安裝 Python 必備連線套件
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 4. 執行腳本並將加密的金鑰安全的傳入環境變數中
    - name: Run ping script
      env:
        SUPABASE_URL: ${{ secrets.ENV_SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.ENV_SUPABASE_KEY }}
      run: python supabase_ping.py